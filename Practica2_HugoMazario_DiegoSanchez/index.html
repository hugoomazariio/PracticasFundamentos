<!DOCTYPE html>
<html lang="es">

<!-- 
    El Juego de la Vida
    Autores:  Hugo Mazarío Ros y Diego Sánchez Álvarez
    Fecha de creación: 21/11/2026
    Fundamentos de Tecnología de Videojuegos - Práctica 2
-->

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El Juego de la Vida</title>

    <link rel="stylesheet" href="CSS/styles.css">
    <!--Scripts. "defer" hace que se ejecute cuando la página ya está cargada
        (así los elementos del HTML ua existen) y en este mismo orden:
        primero las clases (Celula, Mundo) y alfinal main.js, que las usa.     
    -->
    <script src="JS/Celula.js" defer></script>
    <script src="JS/Mundo.js" defer></script>
    <script src="JS/main.js" defer></script>
</head>

<body>
    <h1>El Juego de la Vida</h1>

    <!-- Zona de juego: el canvas donde se dibuja el mundo (su tamaño lo
     fija Mundo.js según TAMANO_MUNDO) + el panel para elegir qué se coloca al hacer clic  -->
    <div class="zona-juego">
        <canvas id="canvasMundo"></canvas>

        <!-- Selector de figuras -->
        <div class="panel-figuras">
            <div class="panel-vista-previa">
                <h3>Vista previa</h3>
                <canvas id="canvasVistaPrevia" width="150" height="150"></canvas>
                <p id="nombreFigura">Célula suelta</p>
            </div>    
            <button class="btn-figura activo" data-figura="celula">Célula suelta</button>

            <h4>Vidas estáticas</h4>
            <button class="btn-figura" data-figura="bote">Bote</button>
            <button class="btn-figura" data-figura="pan">Pan</button>

            <h4>Osciladores</h4>
            <button class="btn-figura" data-figura="intermitente">Intermitente</button>
            <button class="btn-figura" data-figura="sapo">Sapo</button>

            <h4>Naves espaciales</h4>
            <button class="btn-figura" data-figura="planeador">Planeador</button>
            <button class="btn-figura" data-figura="navePesada">Nave espacial pesada</button>
        </div>
    </div>

    <!-- Botones de control de la simulación -->
    <div class="controles">
        <button id="btnReset">Reiniciar</button>
        <button id="btnIniciar">Jugar</button>
        <button id="btnDetener">Detener</button>
        <button id="btnAnteriorGen">Generación anterior</button>
        <button id="btnSiguienteGen">Siguiente generación</button>
        <button id="btnCuadricula">Ocultar cuadrícula</button>
        <button id="btnZoomMenos">Zoom -</button>
        <button id="btnZoomMas">Zoom +</button>


    </div>

    <!-- Estado de la simulación y número de paso-->
    <p id="infoPasos"> Simulación detenida.</p>

    <!-- Información de la célula bajo el ratón: estado y tiempo que lleva así-->
    <p id="infoCelula">Pasa el ratón sobre una célula</p>

    <footer>
        <p>Autores: Hugo Mazarío Ros y Diego Sánchez Álvarez - 21/11/2026</p>
        <p>Fundamentos de Tecnología de Videojuegos - Práctica 2</p>
    </footer>
</body>

</html>

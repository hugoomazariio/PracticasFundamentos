<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El Juego de la Vida</title>

    <link rel="stylesheet" href="CSS/styles.css">
    <script src="JS/celula.js" defer></script>
    <script src="JS/mundo.js" defer></script>
    <script src="JS/main.js" defer></script>

</head>
<body>
    <h1>El Juego de la Vida</h1>

    <!-- Aquí se dibuja el mundo-->
    <canvas id="canvasMundo"></canvas>

    <!-- Botones de control de la simulación -->

    <div>
        <button id="btnReset">Reiniciar</button>
        <button id="btnIniciar">Jugar</button>
        <button id="btnDetener">Detener</button>
        <button id="btnSiguienteGen">Siguiente generación</button>
        <!-- Zoom in, zoom out, cuadricula (anterior generación)-->
    </div>

    <p id="infoCelula">Pasa el ratón sobre una célula</p>

    <footer>
        <p>Autores: Hugo Mazarío Ros y Diego Sánchez Álvarez - 21/11/2026</p>
        <p>Fundamentos de Tecnología de Videojuegos - Práctica 2</p>
    </footer>
</body>
</html>
